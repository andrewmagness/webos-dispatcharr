# The webosbrew Homebrew Channel listing for Dispatcharr TV — DEFERRED, NOT SUBMITTED.
#
# Owner decision, 2026-10-19: the app is not listed on webosbrew/apps-repo until a couple of
# releases have shipped. This file is kept, current, so the listing is a copy-and-submit when that
# day comes; nothing in the release process reads it or submits it.
#
# WHEN IT IS TIME:
#   1. Re-read every claim below against the release being listed (versions, televisions watched,
#      known issues) — it describes v0.1.0.
#   2. Set the repository variable HOMEBREW_LISTING=true, so the release workflow generates and
#      publishes the manifest `manifestUrl` points at (.github/workflows/release.yml, its header),
#      and cut a release so the URL resolves.
#   3. Fork https://github.com/webosbrew/apps-repo and copy this file to
#      `packages/com.magness.dispatcharrtv.yml`.
#
# Schema: content/schemas/packages/PackageInfo.json in that repo.
# Required: title, iconUri, manifestUrl, category, pool, description.

title: Dispatcharr TV

# Raw links to this repository's default branch; `repogen.lintpkg` rejects an iconUri that does not
# return 200. 160 for the listing card, 320 for the detail page; tools/mkicons.py cuts both.
iconUri: https://raw.githubusercontent.com/andrewmagness/webos-dispatcharr/main/pkg/icon160.png
detailIconUri: https://raw.githubusercontent.com/andrewmagness/webos-dispatcharr/main/pkg/icon320.png

# `releases/latest/download/...` always resolves to the newest release, which is how the Channel
# picks up an update without this file changing. It resolves only once a release has been
# published with HOMEBREW_LISTING on (step 2 above).
manifestUrl: https://github.com/andrewmagness/webos-dispatcharr/releases/latest/download/com.magness.dispatcharrtv.manifest.json

category: multimedia
# `main` requires open source; the source and its licences are in the repository and attached to
# every release (the bundled FFmpeg's corresponding source included).
pool: main

# Max 80 characters (schema-enforced).
shortDescription: Live TV from your Dispatcharr server, on the TV's own video decoder

requirements:
  # Passed verbatim to `webosbrew-ipk-verify --fw-releases`. The binary STARTS on every firmware
  # image webosbrew has from 3.4.0 up (tools/fwcompat.py, graded in every release audit) and not on
  # webOS 2 and older; video has been WATCHED on 4.4.3 (an LG B8) and 6.5.3 (an LG C1). The floor
  # below is the playback evidence, not the start evidence — revisit it at submission against the
  # release audit of the version being listed.
  webosRelease: '>=4.0'

description: |
  A native live-TV app for LG webOS televisions that plays the channels of your own
  [Dispatcharr](https://github.com/Dispatcharr/Dispatcharr) server.

  It draws its interface directly on the GPU and hands video to the television's own hardware
  decoder — the same one the built-in apps use — so live channels play without a browser and
  without asking your server to transcode.

  **What it does**

  * Finds your Dispatcharr server on your home network during Setup (or type its address), and
    signs in once with your Dispatcharr username and password; the television keeps an API key,
    never the password
  * A programme guide of every channel with logos and what is on now and next, your Dispatcharr
    channel groups, and a favourites list of your own
  * Changing channel the way a remote does it: CH▲/CH▼, number entry, a now/next banner, and
    hold-OK back to the channel you watched before
  * Starts on the last channel you watched, tunes it again when you come back from another app,
    and reconnects on its own when a stream drops or freezes
  * H.264 and HEVC video with AAC, AC-3, E-AC-3, DTS and MP2/MP3 audio, on the hardware decoder

  **Please read before installing**

  * **You need a Dispatcharr server.** This app has no channels of its own.
  * **Watched on two televisions.** An LG OLED C1 on webOS 6.5.3 and an LG OLED B8 on webOS 4.4.3.
    Other sets from webOS 4 up are expected to work but have not been watched; a report either
    way is welcome.
  * **MPEG-2 video channels do not play** — set an H.264 stream profile for them in Dispatcharr.
    Some televisions cannot decode DTS audio; use an AC-3 or AAC profile for those channels.

  The app talks only to your Dispatcharr server and the logo images its channels name. It has no
  crash reporting and no analytics.

  Not affiliated with, endorsed by, or sponsored by the Dispatcharr project or LG Electronics.

  Source, issues and the privacy policy: https://github.com/andrewmagness/webos-dispatcharr
